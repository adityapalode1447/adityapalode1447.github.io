<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Analytics | Aditya Devidas Palode</title>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b14;--p:#0a1422;--ln:#162840;--tx:#dbe9f7;--mu:#8aa0b8;--cy:#5ee1ff;--rd:#ff5d73;--am:#ffb454;--gn:#4ade9f;--in:#07101c;--tr:#0d1b2e;--on:#04111c;--th:75%;color-scheme:dark}
:root[data-theme=light]{--bg:#f3f6fa;--p:#fff;--ln:#d3deea;--tx:#10243a;--mu:#52677d;--cy:#0b7a9e;--rd:#cf3550;--am:#a86400;--gn:#0f8a57;--in:#fff;--tr:#e3eaf2;--on:#fff;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 'Exo 2',system-ui,sans-serif;padding:clamp(12px,3vw,32px);max-width:1180px;margin:auto}
h1,h2,h3,.big{font-family:'Bai Jamjuree',system-ui,sans-serif}
h1{font-size:clamp(28px,5vw,44px);line-height:1.05}
h2{font-size:19px;margin-bottom:10px}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.mu{color:var(--mu);font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--ln);padding-bottom:10px}
button,input,select,textarea{font:inherit;color:var(--tx)}
.tab,.btn{background:none;border:1px solid var(--ln);border-radius:99px;padding:6px 16px;cursor:pointer;color:var(--mu)}
.tab[aria-selected=true]{border-color:var(--cy);color:var(--cy);background:#5ee1ff14}
.btn.pri{background:var(--cy);color:var(--on);border-color:var(--cy);font-weight:600}
.btn.dg{color:var(--rd);border-color:#ff5d7355}
.btn:hover,.tab:hover{border-color:var(--cy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:2px 12px;font-size:13px}
input,select,textarea{background:var(--in);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
label.ck{display:flex;gap:8px;align-items:center;margin:0;padding-bottom:8px}
code{background:var(--tr);padding:1px 6px;border-radius:5px}
.auth{max-width:420px;margin:7vh auto}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kp .card{margin:0}
.big{font-size:34px;font-weight:700;line-height:1.1;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:500;font-size:12px}
.sc{overflow-x:auto}
.pill{display:inline-block;min-width:52px;text-align:center;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.hi{background:#ff5d7326;color:var(--rd)}.md{background:#ffb45426;color:var(--am)}.lo{background:#4ade9f1f;color:var(--gn)}
.bar{position:relative;height:10px;background:var(--tr);border-radius:5px;margin:8px 0}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar:after{content:"";position:absolute;left:var(--th);top:-3px;bottom:-3px;width:2px;background:var(--am)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:99px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 12px;cursor:pointer;color:var(--mu)}
.seg .on1{background:#4ade9f26;color:var(--gn)}.seg .on0{background:#ff5d7326;color:var(--rd)}
.seg .on2,.seg .on3{background:#ffb45426;color:var(--am)}.seg .on4{background:#5ee1ff26;color:var(--cy)}
.err{color:var(--rd);font-size:13px;min-height:20px;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cy);color:var(--on);padding:8px 18px;border-radius:99px;font-weight:600;z-index:9}
.toast.bad{background:var(--rd);color:#fff}
.fc{border-left:3px solid var(--cy);padding:4px 10px;margin-top:8px;font-size:13px;color:var(--mu)}
.warn{border:1px solid #ff5d7366;background:#ff5d7314;border-radius:14px;padding:12px 16px;margin-bottom:14px}
.warn b{color:var(--rd)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);grid-auto-columns:14px;gap:3px;overflow-x:auto;padding:2px 0 6px}
.hm i,.lg i{display:block;width:14px;height:14px;border-radius:3px;background:var(--tr)}
.hm .g,.lg .g{background:var(--gn)}.hm .y,.lg .y{background:var(--am)}.hm .r,.lg .r{background:var(--rd)}.hm .f{background:transparent}
.lg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mu);margin-top:6px}
.lg span{display:inline-flex;gap:6px;align-items:center}
.ch{width:100%;height:auto;display:block}
.tl{fill:none;stroke:var(--cy);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.tp{fill:var(--p);stroke:var(--cy);stroke-width:2.5}
.tg{stroke:var(--ln);stroke-width:1}
.tt{stroke:var(--am);stroke-width:1.5;stroke-dasharray:5 4}
.ax{font-size:11px;fill:var(--mu)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

.tab,.btn,.seg button{transition:transform .18s ease,box-shadow .18s ease,border-color .18s,color .18s,background .18s}
.tab:hover,.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--cy) 60%,transparent)}
.tab:active,.btn:active:not(:disabled){transform:translateY(0) scale(.97);box-shadow:none}
.tab:not([aria-selected=true]):hover{color:var(--tx)}
.seg button:hover{color:var(--tx);background:color-mix(in srgb,var(--cy) 10%,transparent)}
.card{transition:border-color .2s,box-shadow .2s,transform .2s}
.kp .card:hover,.sg .card:hover,.pc:hover{transform:translateY(-3px);border-color:var(--cy);box-shadow:0 12px 24px -14px color-mix(in srgb,var(--cy) 70%,transparent)}
td{transition:background .15s}tr:hover>td{background:color-mix(in srgb,var(--cy) 6%,transparent)}
input,select,textarea{transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 25%,transparent)}
.hm i{transition:transform .12s}.hm i:hover{transform:scale(1.35)}
.fade{animation:fin .32s ease both}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{animation:fin .25s ease both}
.av{width:46px;height:46px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--gn));color:var(--on);display:grid;place-items:center;font:700 18px 'Bai Jamjuree',system-ui,sans-serif;transition:transform .2s}
.av.sm{width:36px;height:36px;font-size:14px}.av.lg{width:64px;height:64px;font-size:24px}
.chip{display:flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;text-align:left;padding:0;color:var(--tx)}
.chip:hover .av,.pc:hover .av{transform:scale(1.08) rotate(-4deg)}
.pc{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pc .info{flex:1;min-width:200px}.pc .stats{display:flex;gap:22px;flex-wrap:wrap}.pc .stats b{display:block;font:700 20px 'Bai Jamjuree',system-ui,sans-serif}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0}dl.kv dt{color:var(--mu);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pr{display:none}
@media print{
 body{background:#fff;color:#000;padding:0;max-width:none}
 .np{display:none!important}.pr{display:block!important;margin-bottom:10px}
 .card{border:0;background:none;padding:0;margin:0}
 th,td{border-color:#999;color:#000}th{color:#333}.mu{color:#333}
 .pill{border:1px solid #888;background:none!important;color:#000!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),K='att_app_v1',KT='att_theme';
const E=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ld=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); /* local date, not UTC */
const fd=d=>d?new Date(d+'T00:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'';
const SLOTS=['Lecture 1','Lecture 2','Lecture 3','Lecture 4','Lecture 5','Lecture 6','Lab','Tutorial'];
const ST={1:'Present',0:'Absent',2:'Leave',3:'Medical',4:'On duty (OD)'},SH={1:'P',0:'A',2:'L',3:'Med',4:'OD'};
const DEF=['Physics','Mathematics','Chemistry','Biology','History','English','Marathi','Social Science'];
let TH=75;
const setTH=()=>{TH=+D.settings.th||75;document.documentElement.style.setProperty('--th',TH+'%')};
function norm(d){
  d=d&&typeof d=='object'?d:{};
  ['users','students','sessions'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  if(!Array.isArray(d.subjects))d.subjects=DEF.slice();
  d.subjects=d.subjects.map(s=>typeof s=='string'?{name:s,year:'',branch:'',teacher:''}:{name:String(s.name),year:s.year||'',branch:s.branch||'',teacher:s.teacher||''});
  d.sessions.forEach(s=>{if(!s.slot)s.slot=SLOTS[0]});
  d.settings=Object.assign({th:75,sem:''},d.settings);
  d.settings.map=Object.assign({2:'a',3:'x',4:'p'},d.settings.map);
  d.undo=d.undo||null;return d}
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=norm(D);setTH();
let theme='dark';try{theme=localStorage.getItem(KT)||'dark'}catch(e){}
const applyTheme=()=>document.documentElement.dataset.theme=theme;applyTheme();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
let me=null;try{me=JSON.parse(sessionStorage.getItem('me'))}catch(e){}
const today=ld(new Date());
let ANIM=false;
let tab=me?(me.role=='student'?'my':'dash'):'',A={mode:'login',role:'student'},
M={sub:'',date:today,slot:SLOTS[0],year:'',branch:'',q:'',v:{}},RP={year:'',branch:'',q:'',from:'',to:'',def:false},
PR={sub:'',from:'',to:''},T={g:'w'},FC={sub:'',n:5},SQ='',SV='',BT='',IM=null;

/* ---------- helpers ---------- */
const isAdm=()=>me&&me.role=='admin';
const subObjs=()=>isAdm()?D.subjects:D.subjects.filter(s=>s.teacher==me.id);
const vis=()=>subObjs().map(s=>s.name);
const sobj=n=>D.subjects.find(s=>s.name==n);
const normBranch=v=>String(v||'').toLowerCase().replace(/\b(b\s*\.?\s*tech|bachelor\s*of\s*technology)\b/g,'').replace(/[^a-z0-9]+/g,'').trim();
const applies=(b,s)=>(!b.year||String(b.year)==String(s.year))&&(!b.branch||normBranch(b.branch)==normBranch(s.branch));
const myStu=()=>isAdm()?D.students:D.students.filter(s=>subObjs().some(b=>applies(b,s)));
const eff=v=>v==1?1:v==0?0:({p:1,a:0,x:null})[D.settings.map[v]]??null;
const below=v=>v!=null&&v<TH-1e-9;
const pc=v=>v==null?'–':Math.round(v)+'%',cl=v=>v==null?'':below(v)?'hi':v<Math.min(TH+10,100)?'md':'lo';
const pill=(v,t)=>`<span class="pill ${cl(v)}"${t?` title="${E(t)}"`:''}>${pc(v)}</span>`;
const hash=async s=>{if(!crypto.subtle)return btoa(s);const b=new TextEncoder().encode('att|'+s);return[...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('')};
function stat(prn,sub,r){
  const S=sub==null?null:new Set([].concat(sub));let p=0,t=0,x=0;
  D.sessions.forEach(s=>{
    if((S&&!S.has(s.sub))||!(prn in s.m))return;
    if(r&&((r.from&&s.date<r.from)||(r.to&&s.date>r.to)))return;
    const e=eff(s.m[prn]);if(e==null)x++;else{t++;p+=e}});
  return{p,t,x,pc:t?p/t*100:null}}
const toast=(m,bad)=>{document.querySelectorAll('.toast').forEach(t=>t.remove());const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.setAttribute('role','status');d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2600)};
const opts=(a,v,all)=>(all?`<option value="">${all}</option>`:'')+a.map(x=>`<option${x==v?' selected':''}>${E(x)}</option>`).join('');
const branches=()=>[...new Set(D.students.map(s=>s.branch))];
const years=()=>[...new Set(D.students.map(s=>s.year))].sort((a,b)=>a-b);
const flt=(f,base)=>(base||myStu()).filter(s=>(!f.year||s.year==f.year)&&(!f.branch||s.branch==f.branch)&&(!f.q||(s.name+s.prn).toLowerCase().includes(f.q.toLowerCase())));
const wk=d=>{const z=new Date(d+'T00:00:00Z');z.setUTCDate(z.getUTCDate()-(z.getUTCDay()+6)%7);return z.toISOString().slice(0,10)};
const cell=c=>{c=String(c);if(/^[=+\-@\t\r]/.test(c))c="'"+c;return'"'+c.replace(/"/g,'""')+'"'}; /* CSV injection guard */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const staffIdTaken=id=>D.users.some(u=>u.id.toLowerCase()==id.toLowerCase())||D.students.some(s=>s.prn.toLowerCase()==id.toLowerCase());

/* ---------- auth ---------- */
function auth(){
  const su=A.mode=='signup',ad=A.role=='admin';
  return`<div class="card auth"><h1>Attendance Analytics</h1>
  <p class="mu" style="margin:6px 0 14px">Track attendance subject by subject. Admins and teachers record it, students see their own numbers.</p>
  <div class="nav" style="border:0;padding:0">
   <button class="tab" role="tab" aria-selected="${!su}" data-a="mode" data-v="login">Log in</button>
   <button class="tab" role="tab" aria-selected="${su}" data-a="mode" data-v="signup">Sign up</button></div>
  ${su?`<label for="role">I am a</label><select id="role" data-f="role"><option value="student"${!ad?' selected':''}>Student</option><option value="admin"${ad?' selected':''}>Admin (first-time setup)</option></select>`:''}
  ${su&&ad?'<label for="nm">Full name</label><input id="nm" autocomplete="name">':''}
  <label for="uid">${su&&!ad?'PRN (as added by your admin)':!su?'Admin / teacher username or student PRN':'Choose an admin username'}</label>
  <input id="uid" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="${su?'new-password':'current-password'}">
  <p class="err" id="err" role="alert"></p>
  <button class="btn pri" style="width:100%;margin-top:6px" data-a="${su?'signup':'login'}">${su?'Create account':'Log in'}</button>
  ${su?'<p class="mu" style="margin-top:12px">The first admin account is created here. Students can sign up only after the admin adds their PRN. Teachers get their login from the admin.</p>':''}
  <p style="margin-top:14px"><button class="btn sm" data-a="theme">${theme=='dark'?'Light mode':'Dark mode'}</button></p></div>`;
}
const err=(m,id)=>{const e=$('#'+(id||'err'));if(e)e.textContent=m;return 1};
const ini=n=>String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
async function signIn(u){me={id:u.id,role:u.role,name:u.name};sessionStorage.setItem('me',JSON.stringify(me));tab=u.role=='student'?'my':'dash';ANIM=true;R()}
async function login(){
  const id=$('#uid').value.trim().toLowerCase(),h=await hash($('#pw').value),u=D.users.find(u=>u.id.toLowerCase()==id);
  if(!u||u.h!=h)return err('ID or password is wrong. Check both and try again.');
  signIn(u)}
async function signup(){
  const id=$('#uid').value.trim(),pw=$('#pw').value,ad=A.role=='admin',nm=ad?$('#nm').value.trim():'';
  if(!id||pw.length<6)return err('Enter an ID and a password of at least 6 characters.');
  if(D.users.some(u=>u.id.toLowerCase()==id.toLowerCase()))return err('This ID already has an account. Log in instead.');
  let u;
  if(ad){
    if(D.users.some(u=>u.role=='admin'))return err('An admin already exists. Ask them to add you as a student or teacher.');
    if(!nm)return err('Enter your name.');
    u={id,role:'admin',name:nm,h:await hash(pw),created:today};
  }else{
    const s=D.students.find(s=>s.prn.toLowerCase()==id.toLowerCase());
    if(!s)return err('This PRN is not in the student list. Ask your admin to add you first.');
    u={id:s.prn,role:'student',name:s.name,h:await hash(pw),created:today};
  }
  D.users.push(u);save();signIn(u)}

/* ---------- shell ---------- */
function tabs(){
  if(me.role=='admin')return[['dash','Dashboard'],['stu','Students'],['tch','Teachers'],['mark','Mark attendance'],['past','Past records'],['rep','Reports'],['sub','Subjects'],['set','Settings'],['acc','Profile']];
  if(me.role=='teacher')return[['dash','Dashboard'],['mark','Mark attendance'],['past','Past records'],['rep','Reports'],['acc','Profile']];
  return[['my','My attendance'],['hist','History'],['acc','Profile']]}
function shell(){
  const Tb=tabs();if(!Tb.some(t=>t[0]==tab)&&!(tab=='sv'&&isAdm()))tab=Tb[0][0];
  const v={dash,stu,tch,mark,past,rep,sub,set,acc,my,hist,sv}[tab]();
  return`<div class="top np"><div><h1 style="font-size:28px">Attendance Analytics</h1><button class="chip" style="margin-top:6px" data-a="tab" data-v="acc" aria-label="Open my profile"><span class="av sm">${E(ini(me.name))}</span><span><b style="font-weight:600">${E(me.name)}</b><br><span class="mu">${me.role=='admin'?'Admin':me.role=='teacher'?'Teacher':'Student '+E(me.id)} &middot; View profile</span></span></button></div>
  <span><button class="btn" data-a="theme">${theme=='dark'?'Light mode':'Dark mode'}</button> <button class="btn" data-a="logout">Log out</button></span></div>
  <div class="nav np" role="tablist">${Tb.map(t=>`<button class="tab" role="tab" aria-selected="${t[0]==tab||(tab=='sv'&&t[0]=='stu')}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${v}`;
}
function R(){
  const a=$('#app'),ae=document.activeElement;let sel=null,ss=null,se=null;
  if(ae&&a.contains(ae)){const d=ae.dataset;
    sel=ae.id?'#'+ae.id:d.a?`[data-a="${CSS.escape(d.a)}"]`+(d.p!=null?`[data-p="${CSS.escape(d.p)}"]`:'')+(d.v!=null?`[data-v="${CSS.escape(d.v)}"]`:''):null;
    try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}}
  a.innerHTML=me?shell():auth();
  if(ANIM){a.classList.remove('fade');void a.offsetWidth;a.classList.add('fade');ANIM=false}
  if(sel){const n=$(sel);if(n){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}}

/* ---------- charts ---------- */
function trend(){
  const V=new Set(vis()),P=new Set(myStu().map(s=>s.prn)),g={};
  D.sessions.forEach(s=>{if(!V.has(s.sub))return;const k=T.g=='m'?s.date.slice(0,7):wk(s.date);
    for(const p in s.m){if(!P.has(p))continue;const e=eff(s.m[p]);if(e==null)continue;const o=g[k]=g[k]||{p:0,t:0};o.t++;o.p+=e}});
  const pts=Object.keys(g).sort().slice(-12).map(k=>({k,pc:g[k].p/g[k].t*100,t:g[k].t}));
  if(pts.length<2)return`<p class="mu">Record classes in at least two different ${T.g=='m'?'months':'weeks'} to see a trend.</p>`;
  const W=640,H=230,L=40,Rt=70,Tp=14,B=34,lo=Math.max(0,Math.floor((Math.min(...pts.map(p=>p.pc),TH)-8)/10)*10),step=(100-lo)>50?20:10,
  x=i=>L+i*(W-L-Rt)/(pts.length-1),y=v=>Tp+(100-v)*(H-Tp-B)/(100-lo),
  lbl=k=>T.g=='m'?new Date(k+'-01T00:00:00Z').toLocaleDateString('en-IN',{month:'short',year:'2-digit',timeZone:'UTC'}):new Date(k+'T00:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'UTC'});
  let grid='';for(let v=lo;v<=100;v+=step)grid+=`<line class="tg" x1="${L}" x2="${W-Rt}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;
  const every=pts.length>8?2:1;
  return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Attendance trend over ${pts.length} ${T.g=='m'?'months':'weeks'}. Latest ${pc(pts[pts.length-1].pc)}, requirement ${TH}%.">${grid}
  <line class="tt" x1="${L}" x2="${W-Rt}" y1="${y(TH)}" y2="${y(TH)}"/><text class="ax" x="${W-Rt+6}" y="${y(TH)+4}">Min ${TH}%</text>
  <polyline class="tl" points="${pts.map((p,i)=>x(i)+','+y(p.pc)).join(' ')}"/>

function heat(prn){

  D.sessions.forEach(s=>{if(!(prn in s.m))return;const d=days[s.date]=days[s.date]||{p:0,t:0},e=eff(s.m[prn]);if(e!=null){d.t++;d.p+=e}});
  const t0=new Date(wk(today)+'T00:00:00Z');t0.setUTCDate(t0.getUTCDate()-7*19);let h='';
  for(let i=0;i<140;i++){const z=new Date(t0);z.setUTCDate(z.getUTCDate()+i);const s=z.toISOString().slice(0,10);
    if(s>today){h+='<i class="f"></i>';continue}
    const d=days[s],c=!d?'':!d.t?'':d.p==d.t?'g':d.p==0?'r':'y',tt=!d?'No class':d.t?`${d.p} of ${d.t} classes attended`:'Excused';

}

/* ---------- student view ---------- */
const mySubs=s=>D.subjects.filter(b=>applies(b,s)||stat(s.prn,b.name).t>0).map(b=>b.name);
function advice(x){
  if(!x.t)return'No classes recorded yet.';const q=TH/100;
  if(!below(x.pc)){const k=Math.floor(x.p/q-x.t+1e-9);return k>0?`You can miss ${k} more class${k>1?'es':''} and stay above ${TH}%.`:`Do not miss the next class to stay above ${TH}%.`}
  return`Attend the next ${Math.ceil((q*x.t-x.p)/(1-q)-1e-9)} classes in a row to reach ${TH}%.`}
function stuView(s,adm){
  const names=mySubs(s),o=stat(s.prn,names),bad=names.map(n=>[n,stat(s.prn,n)]).filter(a=>below(a[1].pc)),sel=FC.sub&&names.includes(FC.sub)?FC.sub:'',fo=stat(s.prn,sel||names),n=Math.max(1,Math.min(60,Math.round(+FC.n)||1));
  return`${!adm&&(below(o.pc)||bad.length)?`<div class="warn" role="status"><b>Low attendance warning.</b> ${below(o.pc)?`Your overall attendance is ${pc(o.pc)}, below the ${TH}% requirement. `:''}${bad.length?`Below ${TH}% in: ${bad.map(a=>E(a[0])+' ('+pc(a[1].pc)+')').join(', ')}.`:''}</div>`:''}
  <div class="card"><h2>${E(s.name)}</h2><p class="mu">PRN ${E(s.prn)} &middot; Year ${s.year} &middot; ${E(s.branch)}</p>
  <div style="display:flex;align-items:baseline;gap:12px;margin-top:10px;flex-wrap:wrap"><span class="big" style="font-size:48px;color:var(--${o.pc==null?'mu':below(o.pc)?'rd':'gn'})">${pc(o.pc)}</span><span class="mu">overall &middot; ${o.p} present of ${o.t} classes${o.x?' &middot; '+o.x+' excused':''}</span></div></div>
  <div class="card"><h2>What if?</h2><div class="row2"><div><label for="fs">Subject</label><select id="fs" data-f="fcs">${opts(names,sel,'All subjects')}</select></div><div><label for="fn">Number of classes</label><input id="fn" type="number" min="1" max="60" value="${E(FC.n)}" data-q="fcn"></div></div>
  ${fo.t?`<div class="fc">If ${adm?'they':'you'} miss the next ${n}: ${pill(fo.p/(fo.t+n)*100)} <span class="mu">(now ${pc(fo.pc)})</span></div><div class="fc">If ${adm?'they':'you'} attend the next ${n}: ${pill((fo.p+n)/(fo.t+n)*100)}</div>`:'<p class="mu" style="margin-top:8px">No classes recorded yet.</p>'}</div>
  ${heat(s.prn)}
  <div class="sg">${names.map(nm=>{const x=stat(s.prn,nm);return`<div class="card" style="margin:0"><div style="display:flex;justify-content:space-between"><h3>${E(nm)}</h3>${pill(x.pc)}</div><div class="bar"><i style="width:${x.pc||0}%;background:var(--${x.pc==null?'ln':below(x.pc)?'rd':'cy'})"></i></div><span class="mu">${x.p} of ${x.t} classes${x.x?' &middot; '+x.x+' excused':''}</span><p class="fc">${advice(x)}</p></div>`}).join('')}</div>`;
}
function my(){

function histT(prn){
  const r=D.sessions.filter(s=>prn in s.m).sort((a,b)=>b.date.localeCompare(a.date)||String(a.slot).localeCompare(String(b.slot)));
  return`<div class="card" style="margin-top:14px"><h2>Class history</h2><div class="sc"><table><tr><th>Date</th><th>Slot</th><th>Subject</th><th>Status</th></tr>${r.map(s=>{const v=s.m[prn],e=eff(v);return`<tr><td>${fd(s.date)}</td><td>${E(s.slot)}</td><td>${E(s.sub)}</td><td><span class="pill ${e==1?'lo':e==0?'hi':'md'}">${ST[v]||'?'}</span>${v!=1&&v!=0?` <span class="mu">counts as ${e==1?'present':e==0?'absent':'excused'}</span>`:''}</td></tr>`}).join('')||'<tr><td colspan="4" class="mu">No classes recorded yet.</td></tr>'}</table></div></div>`;
}
function hist(){return histT(me.id)}
function sv(){

/* ---------- actions ---------- */
function demo(){
  let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const N=['Aarav Patil','Isha Deshmukh','Rohan Jadhav','Sneha Kulkarni','Kunal Shinde','Pooja More','Omkar Pawar','Riya Joshi','Yash Patil','Neha Jadhav','Tejas More','Sakshi Shinde'];
  N.forEach((n,i)=>{const prn='MGM23'+String(i+1).padStart(3,'0');if(!D.students.some(s=>s.prn==prn))D.students.push({name:n,prn,year:3,branch:'CSE (Data Science)',b:.55+rnd()*.42})});
  D.subjects.forEach((sb,si)=>{const slot=SLOTS[si%4];for(let d=0;d<24;d++){const dt=ld(new Date(Date.now()-(d*2+1)*864e5)),m={};
    D.students.forEach(s=>{let v=rnd()<(s.b||.8)?1:0;const x=rnd();if(x<.03)v=2;else if(x<.05)v=3;else if(x<.08)v=4;m[s.prn]=v});
    if(!D.sessions.some(x=>x.date==dt&&x.sub==sb.name&&x.slot==slot))D.sessions.push({date:dt,sub:sb.name,slot,m})}});
  save();R();toast('Demo data loaded. Sign up with PRN MGM23001 to see a student view.')}
function csv(){
  const L=flt(RP),r={from:RP.from,to:RP.to},N=subObjs().filter(b=>L.some(s=>applies(b,s))).map(b=>b.name);
  let rows=L.map(s=>({s,o:stat(s.prn,N,r),c:N.map(n=>stat(s.prn,n,r).pc)}));if(RP.def)rows=rows.filter(x=>below(x.o.pc));
  const out=[['Name','PRN','Year','Branch',...N,'Overall'],...rows.map(x=>[x.s.name,x.s.prn,x.s.year,x.s.branch,...x.c.map(pc),pc(x.o.pc)])];
  dl('attendance-report.csv','﻿'+out.map(r=>r.map(cell).join(',')).join('\n'),'text/csv')}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const first=t.split(/\r?\n/).find(l=>l.trim())||'',dl=first.includes('\t')?'\t':',',rows=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==dl){row.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';rows.push(row);row=[]}else c+=ch}
  row.push(c);rows.push(row);return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x))}
function importCSV(t){
  const rows=parseCSV(t);if(rows.length&&(/^name$/i.test(rows[0][0])||/^prn$/i.test(rows[0][1]||'')))rows.shift();
  let add=0,dup=0;const bad=[],seen=new Set(D.students.map(s=>s.prn.toLowerCase()));
  rows.forEach((r,i)=>{const[n,p,y,b]=r,ln='Row '+(i+1)+': ';
    if(!n||!p)return bad.push(ln+'name and PRN are required');
    const yr=+y;if(!Number.isInteger(yr)||yr<1||yr>6)return bad.push(ln+'year must be 1 to 6 ('+p+')');
    if(!b)return bad.push(ln+'branch is missing ('+p+')');
    if(D.users.some(u=>u.role!='student'&&u.id.toLowerCase()==p.toLowerCase()))return bad.push(ln+p+' clashes with a staff username');
    if(seen.has(p.toLowerCase()))return dup++;
    seen.add(p.toLowerCase());D.students.push({name:n,prn:p,year:yr,branch:b});add++});
  save();BT=bad.length?BT:'';
  IM={bad:!add&&bad.length>0,m:`Imported ${add} student${add==1?'':'s'}. Skipped ${dup} already in the list.`+(bad.length?`\n${bad.length} row${bad.length>1?'s':''} had problems:\n`+bad.slice(0,5).join('\n')+(bad.length>5?'\n...and '+(bad.length-5)+' more':''):'')};
  R()}

  saveprof:()=>{
